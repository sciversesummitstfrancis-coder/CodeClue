name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Cache Electron / electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: eb-linux-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Build Linux packages
        env:
          DEBUG: electron-builder
        run: |
          npm run dist -- --linux appimage tar.xz --publish never 2>&1 | tee build-log.txt
          test ${PIPESTATUS[0]} -eq 0
      - name: Collect Linux artifacts
        run: |
          mkdir -p artifacts
          cp dist/*.AppImage dist/*.tar.xz artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts
      - name: Diagnose build failure
        if: failure()
        run: |
          tail -n 40 build-log.txt | while IFS= read -r l; do echo "::error::${l:0:250}"; done
        shell: bash

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Cache Electron / electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-win-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Build Windows installer
        shell: bash
        run: |
          npm run dist -- --win nsis --publish never 2>&1 | tee build-log.txt
          test ${PIPESTATUS[0]} -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*.exe
      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          tail -n 40 build-log.txt | while IFS= read -r l; do echo "::error::${l:0:250}"; done

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
